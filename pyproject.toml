[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyprolog"
version = "0.8.0"
description = "Prolog Interpreter in Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "yaziuma"}
]
keywords = ["prolog", "interpreter", "python", "logic", "programming"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Prolog",
    "Topic :: Software Development :: Interpreters",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
]
dependencies = [
    "colorama>=0.4.6",
    "msgspec>=0.20.0",
    "prompt-toolkit>=3.0.51",
    "rpds-py>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/yaziuma/pyprolog"
Repository = "https://github.com/yaziuma/pyprolog"
"Bug Tracker" = "https://github.com/yaziuma/pyprolog/issues"

[project.scripts]
pyprolog = "pyprolog.cli.prolog:main"

[project.optional-dependencies]
dev = [
    "flake8>=7.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-benchmark>=5.2.3",
    "setuptools>=80.4.0",
    "twine>=6.1.0",
    "wheel>=0.45.1",
    "ruff>=0.11.9",
]

[tool.setuptools.packages.find]
include = ["pyprolog*"]

[tool.setuptools.package-data]
"pyprolog" = [
    "*.md", 
    "*.txt", 
    "*.toml",
    "config/logging/*.conf"  # 追加: ログ設定ファイルを含める
]

[dependency-groups]
dev = [
    "monkeytype>=23.3.0",
    "poethepoet>=0.40.0",
    "pytest>=8.4.1",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=6.2.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--ignore=tests/benchmark"
markers = [
    "info_log: force INFO logging for this test.",
    "bench_light: Lightweight benchmarks (fast, for local/CI)",
    "bench_medium: Medium benchmarks (between light/heavy, for local/CI or staging)",
    "bench_heavy: Heavy benchmarks (slow, for nightly/manual runs)",
    "timeout: per-test timeout (pytest-timeout)",
]

# ============================================================
# ruff
# ============================================================
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

# ============================================================
# mypy
# ============================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false


# ============================================================
# poethepoet
# ============================================================
[tool.poe.tasks]
lint = "ruff check . --fix"
format = "ruff format ."
typecheck = "mypy src/"
test = "pytest"
all = ["lint", "format", "typecheck", "test"]
